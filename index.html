<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Painel Tático</title>
<meta name="description" content="KPIs de xadrez a partir das suas próprias partidas." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#15140f" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Painel Tático" />

<style>
  html, body { margin: 0; padding: 0; background: #15140f; }
  #root { min-height: 100vh; }
  #install-toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #c9a24b; color: #15140f; padding: 10px 18px; border-radius: 8px;
    font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 700;
    display: none; align-items: center; gap: 10px; z-index: 9999; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="install-toast">Instalar app no dispositivo</div>

<!-- React (UMD build, no bundler needed) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- chess.js: converts PGN move text into FEN positions per ply, needed to feed Stockfish.
     Using the 0.12.0 line (pre-module-split) because it reliably exposes a global `Chess`
     constructor from a plain <script> tag — newer 1.0.0-beta builds split into cjs/esm/umd
     folders whose exact global-exposing build isn't consistently confirmed across versions. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>

<script type="text/babel" data-type="module" src="js/app.js"></script>

<script>
  // Service worker registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW falhou:', err));
    });
  }

  // Install prompt handling
  let deferredPrompt;
  const toast = document.getElementById('install-toast');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    toast.style.display = 'flex';
  });
  toast.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    toast.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    toast.style.display = 'none';
  });
</script>
</body>
</html>
